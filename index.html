<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OfertaFlow</title>

<style>

body{
    margin:0;
    background:#f4f4f4;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    border-radius:16px;
    padding:30px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:15px;
    font-size:16px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-top:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<div class="container">

<h1>🛍 OfertaFlow</h1>

<input
id="url"
placeholder="Cole aqui o link da Dafiti">

<button onclick="buscarProduto()">

🔍 Buscar Produto

</button>

</div>
<script>

async function buscarProduto() <script>

async function buscarProduto(){

    const url = document.getElementById("url").value;

    if(!url){
        alert("Cole o link do produto.");
        return;
    }

    const resposta = await fetch("https://hook.us2.make.com/9h9tic2oo03ftyghkomkjyu90if73i4w",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            url:url
        })

    });

    const dados = await resposta.json();

    console.log(dados);

    alert(dados.nome);

}

</script>

</script>
</body>

</html>
