<!DOCTYPE html>
<html lang="pt-BR">
    
    <head>
        <meta charset="UTF-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>OfertaFlow</title>
        
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <div class="container">
            <h1>🛍 OfertaFlow</h1>
            
            <p class="subtitle">
                Busque um produto e publique no Telegram.
            </p>
            
            <textarea
                id="url"
                rows="6"
                placeholder="Cole um ou mais links (um por linha)"></textarea>
            
            <button
                id="btnBuscar"
                onclick="buscarProduto()">
                🔍 Buscar Produto
            </button>

            <p id="statusBusca"> style="display:none;">
                ⏳ Buscando produtos...
            </div>
            
            <div id="cardProduto" class="card">
                <img
                    id="imagem"
                    alt="Imagem do produto"
                    src=""
                    style="display:none;">
                
                <h2 id="nome">
                    Nenhum produto carregado
                </h2>
                
                <div class="precos">
                    <span id="original"></span>
                    <span id="atual"></span>
                </div>
                
                <div id="desconto" class="desconto"></div>
                
                <textarea
                    id="descricao"
                    placeholder="Descrição da oferta..."></textarea>
                <button onclick="copiarDescricao()">
                    📋 Copiar descrição
                </button>
                
                <h3 id="tituloFila">
                    📦 Produtos carregados (0)
                </h3>
                <div class="card">
                    <div id="painelResumo">
                        <h3>📅 Preparar o Dia</h3>
                        <div id="resumoFila"></div>
                        <div id="tempoEstimado"></div>
                        <div id="estatisticasDesconto"></div>
                    </div>
                </div>
                
                <div class="card">
                    <h3>📜 Histórico da Sessão</h3>
                    <div
                        id="historicoSessao"
                        class="historico">
                    </div>

                </div>

                <div id="proximoProduto">
                    <h3>⏭ Próximo Produto</h3>
                    <span id="nomeProximo">
                        Nenhum produto
                    </span>
                </div>
                
                <div id="contadorFila">
                    📦 Fila: 0 produtos
                </div>

                <div id="progressoTexto">
                    0 de 0 publicados
                </div>
                
                <progress
                    id="barraProgresso"
                    value="0"
                    max="0">
                </progress>
                
                <div id="listaProdutos"></div>
                
                <button
                    id="btnTelegram"
                    onclick="publicarTelegram()">
                    📤 Publicar Telegram
                </button>
                
                <button
                    id="btnProximo"
                    onclick="publicarProximo()">
            </div>
        </div>
        
        <script src="script.js"></script>
        
    </body>
</html>
