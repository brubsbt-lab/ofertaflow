<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OfertaFlow</title>

<style>

body{

background:#eef2f7;

font-family:Arial;

margin:0;

padding:30px;

}

.container{

max-width:700px;

margin:auto;

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}

h1{

text-align:center;

margin-bottom:5px;

}

.subtitle{

text-align:center;

color:#666;

margin-bottom:30px;

}

input{

width:100%;

padding:16px;

border-radius:12px;

border:1px solid #ddd;

font-size:16px;

box-sizing:border-box;

}

button{

width:100%;

margin-top:15px;

padding:16px;

border:none;

border-radius:12px;

background:#2563eb;

color:white;

font-size:17px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1d4ed8;

}

.card{

margin-top:35px;

padding:25px;

border:1px solid #eee;

border-radius:18px;

}

img{

width:100%;

border-radius:15px;

margin-bottom:20px;

}

h2{

margin:10px 0;

}

.precos{

display:flex;

justify-content:space-between;

font-size:22px;

font-weight:bold;

margin-top:20px;

}

#original{

text-decoration:line-through;

color:#888;

}

#atual{

color:#0f9d58;

}

.desconto{

margin-top:20px;

display:inline-block;

padding:10px 18px;

background:#d1fae5;

color:#065f46;

border-radius:50px;

font-weight:bold;

}

textarea{

width:100%;

height:120px;

margin-top:25px;

padding:15px;

border-radius:12px;

border:1px solid #ddd;

box-sizing:border-box;

resize:none;

font-size:15px;

}

.telegram{

background:#16a34a;

margin-top:20px;

}

.telegram:hover{

background:#15803d;

}

</style>

</head>

<body>

<div class="container">

    <h1>🛍 OfertaFlow</h1>

    <p class="subtitle">
        Busque um produto e publique no Telegram.
    </p>

    <input
        id="url"
        placeholder="Cole aqui o link da Dafiti">

    <button onclick="buscarProduto()">

        🔍 Buscar Produto

    </button>

    <div id="produto" class="card">

        <img
            id="imagem"
            src=""
            style="display:none;">

        <h2 id="nome">
            Nenhum produto carregado
        </h2>

        <div class="precos">

            <span id="original"></span>

            <span id="atual"></span>

        </div>

        <div id="desconto" class="desconto"></div>

        <textarea
            id="descricao"
            placeholder="Digite uma descrição..."></textarea>

        <button class="telegram">

            🚀 Publicar Telegram

        </button>

    </div>

</div>

    <script>
async function buscarProduto() {

    const url = document.getElementById("url").value;

    if (!url) {
        alert("Cole o link do produto.");
        return;
    }

    try {

        const resposta = await fetch("https://hook.us2.make.com/9h9tic2oo03ftyghkomkjyu90if73i4w", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                url: url
            })
        });

        const dados = await resposta.json();

        let nomeLimpo = dados.nome
            .replace(" - Compre Agora | Dafiti Brasil", "")
            .trim();
        
        document.getElementById("nome").innerHTML = nomeLimpo;

        document.getElementById("original").innerHTML =
            "De: R$ " + dados.precoOriginal;

        document.getElementById("atual").innerHTML =
            "Por: R$ " + dados.precoAtual;

        document.getElementById("imagem").src = dados.imagem;
        document.getElementById("imagem").style.display = "block";

const original = parseFloat(dados.precoOriginal);
const atual = parseFloat(dados.precoAtual);

const desconto = Math.round(
    ((original - atual) / original) * 100
);

document.getElementById("desconto").innerHTML =
    "🔥 " + desconto + "% OFF";

    } catch (erro) {
    console.error(erro);
    alert(erro.message);
    }
}
    </script>
    
</body>

</html>
