<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OfertaFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🛍 OfertaFlow</h1>

    <p class="subtitle">
        Busque um produto e publique no Telegram.
    </p>

    <input
        id="url"
        placeholder="Cole aqui o link da Dafiti">

    <button onclick="buscarProduto()">

        🔍 Buscar Produto

    </button>

    <div id="produto" class="card">

        <img
            id="imagem"
            src=""
            style="display:none;">

        <h2 id="nome">
            Nenhum produto carregado
        </h2>

        <div class="precos">

            <span id="original"></span>

            <span id="atual"></span>

        </div>

        <div id="desconto" class="desconto"></div>

        <textarea
            id="descricao"
            placeholder="Digite uma descrição..."></textarea>

        <button
    id="btnTelegram"
    class="telegram"
    onclick="publicarTelegram()">

            🚀 Publicar Telegram

        </button>

    </div>

</div>

    <script>

        let produtoAtual = null;
        
async function buscarProduto() {

    const url = document.getElementById("url").value;

    if (!url) {
        alert("Cole o link do produto.");
        return;
    }

    try {

        const resposta = await fetch(
            "https://hook.us2.make.com/9h9tic2oo03ftyghkomkjyu90if73i4w",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    url: url
                })
            }
        );

        const dados = await resposta.json();

        const nomeLimpo = dados.nome
            .replace(" - Compre Agora | Dafiti Brasil", "")
            .trim();

        document.getElementById("nome").innerHTML = nomeLimpo;

        document.getElementById("original").innerHTML =
            `De: R$ ${dados.precoOriginal}`;

        document.getElementById("atual").innerHTML =
            `Por: R$ ${dados.precoAtual}`;

        document.getElementById("imagem").src = dados.imagem;
        document.getElementById("imagem").style.display = "block";

        const original = parseFloat(dados.precoOriginal);
        const atual = parseFloat(dados.precoAtual);

        const desconto = Math.round(
            ((original - atual) / original) * 100
        );

        document.getElementById("desconto").innerHTML =
            `🔥 ${desconto}% OFF`;

        document.getElementById("descricao").value =
`🔥 OFERTA

${nomeLimpo}

🔥 ${desconto}% OFF

💰 De R$ ${dados.precoOriginal}
✅ Por apenas R$ ${dados.precoAtual}

🛍️ Compre aqui:
${url}

🏃 Aproveite antes que acabe!`;

        produtoAtual = {
            url: url,
            nome: nomeLimpo,
            precoOriginal: dados.precoOriginal,
            precoAtual: dados.precoAtual,
            imagem: dados.imagem,
            desconto: desconto
        };

    } catch (erro) {

        console.error(erro);
        alert("Erro ao buscar o produto.");

    }

}

        async function publicarTelegram(){

    if(!produtoAtual){
        alert("Busque um produto primeiro.");
        return;
    }

    produtoAtual.descricao =
        document.getElementById("descricao").value;

    try{

        const resposta = await fetch(
            "https://hook.us2.make.com/ziofxokbbynercs7pz56qwh1gunhvkml",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(produtoAtual)
            }
        );

        if(resposta.ok){
            alert("✅ Oferta enviada para o Telegram!");
        }else{
            alert("Erro ao publicar.");
        }

    }catch(erro){
        console.error(erro);
        alert("Erro ao enviar para o Telegram.");
    }

        }
    </script>
    <script src="script.js"></script>
</body>

</html>
